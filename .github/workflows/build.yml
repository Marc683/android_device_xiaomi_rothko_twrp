name: Build TWRP vendor_boot (rothko)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/rothko

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gperf imagemagick libncurses5-dev libssl-dev libxml2-utils \
            lz4 openjdk-21-jdk python3 rsync unzip wget zip zlib1g-dev

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init & sync recovery sources
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"

          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14 --depth=1
          repo sync -c -j1 --force-sync --no-clone-bundle --no-tags --prune --optimized-fetch \
            --partial-clone --clone-filter=blob:none

      - name: Copy device tree into sources
        run: |
          cd "$GITHUB_WORKSPACE/work"
          rm -rf device/xiaomi/rothko
          mkdir -p device/xiaomi
          cp -a "$GITHUB_WORKSPACE/device/xiaomi/rothko" device/xiaomi/rothko

      - name: Build vendor_boot image
        run: |
          cd "$GITHUB_WORKSPACE/work"
          source build/envsetup.sh
          lunch twrp_rothko-eng
          mka vendorbootimage -j"$(nproc)"

      - name: Upload vendor_boot.img
        uses: actions/upload-artifact@v4
        with:
          name: rothko-vendor_boot
          path: work/out/**/vendor_boot.img
